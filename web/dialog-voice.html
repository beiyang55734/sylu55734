<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天</title>
    <link rel="icon" href="common/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/xs-styles.css">
    <link href="css/material-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-area {
            height: 45%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-container {
            height: calc(55vh - 60px);
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            background: transparent;
            opacity: 1;
        }

        .chat-container.hidden {
            opacity: 0;
        }

        .message {
            margin-bottom: 10px;
            display: flex;
            align-items: flex-end;
        }

        /* .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        } */

        .message-content {
            max-width: 90%;
            padding: 8px 8px;
            border-radius: 8px;
            position: relative;
            font-size: 13.5px;
        }

        .message.ai .message-content {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .message.user .message-content {
            background-color: rgba(255, 36, 66, 0.3);
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #ffffff00;
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            z-index: 99;
        }

        .input-container.hidden {
            display: none; 
        }

        .input-area {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 6px;
            height: 50px;
            box-sizing: border-box;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 5px;
            background: none;
        }

        .input-area button {
            background: none;
            border: none;
            font-size: 24px;
            color: #FF2442;
            cursor: pointer;
            margin: 0 5px;
            width: 40px;
            height: 40px;
            position: relative;
        }

        .input-area button .material-icons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .input-area button:hover {
            color: #FF2442;
        }

        .voice-input-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 10px;
            height: 50px;
            box-sizing: border-box;
            width: 100%;
            cursor: pointer;
        }

        .voice-input-area span {
            font-size: 16px;
            color: #FF2442;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: transparent;
            z-index: 100;
            gap: 8px;
        }

        .status-area {
            display: none;
        }

        .voice-waves {
            display: none;
        }

        .voice-wave {
            display: none;
        }

        .voice-wave.active {
            display: none;
        }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 28px; }
        }

        .status-text {
            display: none;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            order: 2;
        }

        .mute-button, .close-button {
            display: none;
        }

        .interrupt-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .interrupt-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .interrupt-button:active {
            transform: scale(0.95);
        }

        .interrupt-button .material-icons {
            font-size: 32px;
            color: #FF2442;
        }
    </style>
</head>
<body>
    <!-- 上半区域 -->
    <div class="top-area"></div>

    <!-- 聊天容器 -->
    <div class="chat-container" id="chat-container">
        <!-- 聊天记录将显示在这里 -->
    </div>

    <!-- 输入区域 -->
    <div class="input-container" id="input-container">
        <div class="input-area" id="input-area">
            <button class="input-toggle" id="toggle-button">
                <i class="material-icons">mic</i>
            </button>
            <div class="voice-input-area" id="voice-input-area">
                <span>点击开始聊天</span>
            </div>
            <input type="text" id="text-input" placeholder="">
            <button class="send-button" id="send-button">
                <i class="material-icons">send</i>
            </button>
        </div>
    </div>

    <!-- 底部栏 -->
    <div class="bottom-bar">
        <div class="button-row">
            <button class="interrupt-button" id="interrupt-button" title="启动">
                <i class="material-icons">play_arrow</i>
            </button>
        </div>
    </div>
    <script src="js/xsComponents.js"></script>
    <script src="js/localStorageManager.js"></script>
    <script src="js/cosyvoiceApi.js"></script>
    <script src="js/tencentTtsApi.js"></script>
    <script src="js/audioPlayer.js"></script>
    <script src="js/audioRecorder.js"></script>
    <script src="js/embedding.js"></script>
    <script src="js/dialogVoice.js"></script>
    <script>
        // 接收来自character.html的消息
        window.addEventListener('message', function(event) {
            console.log('dialog-voice.html接收到消息:', event.data);
            const msgType = event.data && event.data.type;
            if ((msgType === 'speak' || msgType === 'speak_text') && event.data.text) {
                // 调用sendTextMessage函数发送消息给数字人
                if (typeof sendTextMessage === 'function') {
                    console.log('调用sendTextMessage:', event.data.text);
                    sendTextMessage(event.data.text);
                } else {
                    console.error('sendTextMessage函数不存在');
                }
            } else if (msgType === 'stop_speaking' || msgType === 'stop') {
                if (typeof user_abort === 'function') {
                    user_abort();
                }
            }
        });
    </script>
</body>
</html>
