<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人PPT讲解</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .main-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 150px);
        }
        .ppt-section {
            flex: 1.2;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .ppt-viewer {
            flex: 1;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .slide-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .slide-placeholder {
            color: #666;
            font-size: 18px;
            text-align: center;
        }
        .slide-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }
        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-btn:hover { transform: scale(1.1); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .slide-indicator {
            color: #333;
            font-size: 16px;
            padding: 5px 15px;
            background: #f0f0f0;
            border-radius: 15px;
        }
        .narrator-section {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .narrator-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .digital-human-embed {
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .digital-human-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .script-display {
            margin-top: 10px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 12px;
            max-height: 150px;
            overflow: auto;
        }
        .script-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        .script-text {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        .hidden { display: none !important; }
        .upload-area {
            border: 3px dashed #dcdfe6;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-area:hover { border-color: #667eea; background: #f0f0ff; }
        .upload-icon { font-size: 64px; margin-bottom: 15px; }
        .upload-text { font-size: 18px; color: #666; margin-bottom: 10px; }
        .upload-hint { font-size: 14px; color: #999; }
        .file-input { display: none; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .progress-text { text-align: center; margin-top: 15px; color: #666; }
        .slides-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            justify-content: center;
        }
        .slide-thumb {
            width: 80px;
            height: 60px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            overflow: hidden;
        }
        .slide-thumb:hover { border-color: #667eea; }
        .slide-thumb.active { border-color: #667eea; background: #f0f0ff; }
        .voice-select {
            margin-top: 10px;
            text-align: center;
        }
        .voice-select select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .voice-select select:focus {
            border-color: #667eea;
        }
        .play-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            margin-left: 10px;
        }
        .play-btn:hover { box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 数字人PPT讲解</h1>
            <p>上传PPT，数字人将自动为您讲解每一页内容</p>
        </div>

        <!-- 上传区域 -->
        <div class="card" id="uploadCard">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击或拖拽PPT文件到此处</div>
                <div class="upload-hint">支持 .ppt 和 .pptx 格式</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".ppt,.pptx" onchange="handleFileSelect(event)">
            <div class="progress-text" id="progressText"></div>
            <div class="slides-preview" id="slidesPreview"></div>
        </div>

        <!-- 讲解区域 -->
        <div class="main-layout hidden" id="lectureLayout">
            <!-- PPT展示区 -->
            <div class="ppt-section">
                <div class="narrator-title">📊 PPT内容</div>
                <div class="ppt-viewer" id="pptViewer">
                    <img class="slide-image hidden" id="slideImage" src="" alt="幻灯片">
                    <div class="slide-placeholder" id="slidePlaceholder">请上传PPT文件</div>
                </div>
                <div class="slide-nav">
                    <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀</button>
                    <span class="slide-indicator" id="slideIndicator">1 / 1</span>
                    <button class="nav-btn" id="nextBtn" onclick="nextSlide()">▶</button>
                </div>
            </div>

            <!-- 数字人讲解区 -->
            <div class="narrator-section">
                <div class="narrator-title">🤖 数字人讲师</div>
                <div class="digital-human-embed">
                    <iframe id="digitalHumanFrame" src="http://localhost:8000/web/character.html?embed=1" allow="camera; microphone"></iframe>
                </div>
                <div class="script-display">
                    <div class="script-label">📝 当前讲解：</div>
                    <div class="script-text" id="scriptText">讲解脚本将显示在这里...</div>
                </div>
                <div class="voice-select">
                    <select id="voiceSelect">
                        <option value="longlao">龙老 - 沧桑沉稳</option>
                    </select>
                    <button class="btn btn-primary play-btn" onclick="playCurrentScript()">
                        🔊 播放当前讲解
                    </button>
                </div>
                <div style="text-align: center;">
                    <button class="btn btn-primary" onclick="previewVideo()">
                        📹 视频预览
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTask = null;
        let slides = [];
        let slideImages = [];
        let currentSlide = 0;
        let currentAudio = null;
        let generatedAudios = [];
        let digitalHumanStarted = false;
        let userPlaybackEnabled = false;

        async function readJsonSafe(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                const snippet = text ? text.slice(0, 200) : '';
                throw new Error(`HTTP ${res.status} ${res.statusText}: ${snippet}`);
            }
        }

        function resolveMediaUrl(path) {
            if (!path) return '';
            if (/^(https?:|blob:|data:)/i.test(path)) return path;
            return `${window.location.origin}${path.startsWith('/') ? path : `/${path}`}`;
        }

        let currentSpeechUtterance = null;

        function shouldUseSpeechNarration(audioPath) {
            return !audioPath || /\.wav($|\?)/i.test(audioPath);
        }

        function stopSpeechNarration() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            currentSpeechUtterance = null;
        }

        function getSpeechVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            return voices.find(v => /^zh/i.test(v.lang)) || voices[0] || null;
        }

        function speakCurrentScriptText(onend) {
            const text = slides[currentSlide]?.script || '';
            if (!text || !('speechSynthesis' in window)) return false;

            stopSpeechNarration();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1;
            const voice = getSpeechVoice();
            if (voice) utterance.voice = voice;
            if (typeof onend === 'function') utterance.onend = onend;
            currentSpeechUtterance = utterance;
            window.speechSynthesis.speak(utterance);
            return true;
        }

        function startDigitalHuman() {
            if (digitalHumanStarted) return;
            const iframe = document.getElementById('digitalHumanFrame');
            if (iframe && iframe.contentWindow) {
                try {
                    iframe.contentWindow.postMessage({ type: 'start' }, 'http://localhost:8000');
                    digitalHumanStarted = true;
                } catch (e) {
                    console.warn('启动数字人失败:', e);
                }
            }
        }

        window.addEventListener('load', () => {
            const iframe = document.getElementById('digitalHumanFrame');
            if (iframe) {
                iframe.addEventListener('load', () => startDigitalHuman());
            }
        });

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('progressText').textContent = '上传中...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const uploadRes = await fetch('http://localhost:8889/api/upload_ppt', {
                    method: 'POST',
                    body: formData
                });
                const uploadData = await readJsonSafe(uploadRes);

                if (uploadData.code !== 0) throw new Error(uploadData.message);

                currentTask = uploadData.data;
                slides = currentTask.slides;
                slideImages = currentTask.slide_images || [];
                document.getElementById('progressText').textContent = '生成讲解脚本中...';

                const scriptRes = await fetch(`http://localhost:8889/api/generate_scripts?task_id=${currentTask.task_id}`, {
                    method: 'POST'
                });
                const scriptData = await readJsonSafe(scriptRes);

                if (scriptData.code !== 0) throw new Error(scriptData.message);

                slides = scriptData.data.scripts;
                document.getElementById('progressText').textContent = '生成讲解语音中...';

                const audioRes = await fetch(`http://localhost:8889/api/generate_audio?task_id=${currentTask.task_id}`, {
                    method: 'POST'
                });
                const audioData = await readJsonSafe(audioRes);

                if (audioData.code !== 0) throw new Error(audioData.message);

                // 保留与 slides 的索引对齐（不要 filter 掉空项，否则后面会出现“声音和内容对不上”）
                generatedAudios = audioData.data.audios.map(a => a.audio_url);

                document.getElementById('uploadCard').classList.add('hidden');
                document.getElementById('lectureLayout').classList.remove('hidden');

                startDigitalHuman();
                showSlide(0);

            } catch (error) {
                alert('处理失败: ' + error.message);
                document.getElementById('progressText').textContent = '';
            }
        }

        function showSlide(index) {
            if (index < 0 || index >= slides.length) return;

            currentSlide = index;
            const slide = slides[index];

            const slideImage = document.getElementById('slideImage');
            const slidePlaceholder = document.getElementById('slidePlaceholder');

            console.log('显示幻灯片', index);
            console.log('slideImages数组:', slideImages);
            console.log('当前索引图片:', slideImages ? slideImages[index] : 'undefined');

            if (slideImages && slideImages[index]) {
                const imageUrl = resolveMediaUrl(slideImages[index]);
                console.log('加载图片:', imageUrl);
                
                slideImage.onload = function() {
                    console.log('图片加载成功');
                    slideImage.classList.remove('hidden');
                    slidePlaceholder.classList.add('hidden');
                };
                
                slideImage.onerror = function() {
                    console.error('图片加载失败:', imageUrl);
                    slideImage.classList.add('hidden');
                    slidePlaceholder.classList.remove('hidden');
                    slidePlaceholder.textContent = `第 ${slide.slide} 页：${slide.title || ''}（图片加载失败）`;
                };
                
                slideImage.src = imageUrl;
            } else {
                console.log('没有可用的图片，显示文字');
                slideImage.classList.add('hidden');
                slidePlaceholder.classList.remove('hidden');
                slidePlaceholder.textContent = `第 ${slide.slide} 页：${slide.title || ''}`;
            }

            document.getElementById('scriptText').textContent = slide.script || '';
            document.getElementById('slideIndicator').textContent = `${index + 1} / ${slides.length}`;

            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === slides.length - 1;

            stopSpeechNarration();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const audioPath = generatedAudios && generatedAudios[index] ? generatedAudios[index] : '';
            if (audioPath && !shouldUseSpeechNarration(audioPath)) {
                currentAudio = new Audio(resolveMediaUrl(audioPath));
                if (userPlaybackEnabled) {
                    currentAudio.play().catch(() => {
                        speakCurrentScriptText();
                    });
                }
            } else if (userPlaybackEnabled) {
                speakCurrentScriptText();
            }

            // 由“播放当前讲解”按钮触发播放，避免浏览器自动播放策略导致无反应
            startDigitalHuman();
        }

        function playCurrentScript() {
            userPlaybackEnabled = true;
            const audioPath = generatedAudios && generatedAudios[currentSlide] ? generatedAudios[currentSlide] : '';
            if (shouldUseSpeechNarration(audioPath) && speakCurrentScriptText()) {
                return;
            }
            if (currentAudio) {
                currentAudio.currentTime = 0;
                currentAudio.play().catch(err => {
                    console.error('播放失败:', err);
                    alert('播放失败：请点击页面任意位置后重试（浏览器可能阻止自动播放）');
                });
            } else {
                alert('当前页没有可播放的音频');
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                showSlide(currentSlide + 1);
            }
        }



        function previewVideo() {
            if (slides.length === 0) {
                alert('请先上传PPT并生成讲解内容');
                return;
            }

            console.log('准备预览，数据:', {
                slides: slides.length,
                slideImages: slideImages.length,
                generatedAudios: generatedAudios.length
            });

            const data = {
                slides: slides,
                slideImages: slideImages,
                generatedAudios: generatedAudios
            };

            // 尝试使用URL参数传递数据作为备用方案
            const dataParam = encodeURIComponent(JSON.stringify(data));
            const previewUrl = `video-preview.html?data=${dataParam}`;
            const previewWindow = window.open(previewUrl, '_blank', 'width=1000,height=800');
            
            if (previewWindow) {
                // 等待窗口加载
                let checkCount = 0;
                const checkInterval = setInterval(() => {
                    checkCount++;
                    if (checkCount > 20) { // 10秒超时
                        clearInterval(checkInterval);
                        console.error('预览窗口加载超时');
                    } else if (previewWindow.document && previewWindow.document.readyState === 'complete') {
                        clearInterval(checkInterval);
                        console.log('预览窗口加载完成，发送数据');
                        previewWindow.postMessage({ type: 'init', data: data }, '*');
                    }
                }, 500);
            } else {
                console.error('无法打开预览窗口');
                alert('无法打开预览窗口，请检查浏览器设置');
            }
        }

        function downloadAudios() {
            if (generatedAudios.length === 0) {
                alert('没有可下载的音频');
                return;
            }

            generatedAudios.forEach((audioPath, index) => {
                if (audioPath) {
                    setTimeout(() => {
                        window.open(resolveMediaUrl(audioPath));
                    }, index * 500);
                }
            });
        }

        window.onload = function() {
            document.getElementById('slidePlaceholder').textContent = '请上传PPT文件';
        };
    </script>
</body>
</html>
